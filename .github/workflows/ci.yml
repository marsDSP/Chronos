name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install JUCE Linux dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          # enable universe repos (software-properties-common provides add-apt-repository)
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends software-properties-common
          sudo add-apt-repository -y universe
          sudo apt-get update

          # choose the first available webkit dev package
          WEBKIT_CANDIDATES="libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.2-dev libwebkit2gtk-4.3-dev"
          WEBKIT_PKG=""
          for p in $WEBKIT_CANDIDATES; do
            if apt-cache show "$p" >/dev/null 2>&1; then
              WEBKIT_PKG="$p"
              break
            fi
          done

          if [ -z "$WEBKIT_PKG" ]; then
            echo "No libwebkit2gtk-dev package found in apt repos; aborting."
            exit 1
          fi

          # Install packages (use the discovered webkit package)
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcomposite-dev libxinerama-dev libxcursor-dev \
            libxrandr-dev libxext-dev libfreetype6-dev libasound2-dev \
            libgl1-mesa-dev libglu1-mesa-dev pkg-config \
            libgtk-3-dev "$WEBKIT_PKG" libfontconfig1-dev \
            libgdk-pixbuf2.0-dev

      - name: Install modern GCC (Linux only)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # GCC 14 is the first to report __cplusplus = 202302L for -std=c++23;
          # GCC 13 reports 202100L, which fails Config.h's
          # static_assert(__cplusplus >= 202302L).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          g++ --version

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure
        run: >
          cmake -S . -B build
          -DBUILD_TEST_HARNESSES=ON
          -DBUILD_AUDIO_PLUGIN_HOST=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=23
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_EXTENSIONS=OFF

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (correctness harnesses)
        # golden_render_check compares against macOS-baselined FNV hashes. The
        # antiderivatives call std::exp/std::tan, which differ across libm, so
        # the committed hashes only match on macOS. Run it there; skip it on
        # Linux and Windows (cross-platform hash drift is expected, not a defect).
        # shell: bash forces Git Bash on Windows (the runner default is
        # PowerShell, which cannot parse the POSIX if/test syntax below).
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ctest --test-dir build -C Release --output-on-failure -LE bench
          else
            ctest --test-dir build -C Release --output-on-failure -LE bench -E golden_render_check
          fi

      - name: Build pluginval (vendored, own build directory)
        # Built separately so its target names never collide with the
        # plugin's JUCE.
        run: |
          cmake -S libs/pluginval -B build-pluginval -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pluginval --config Release -j

      - name: pluginval (strictness 10, every format)
        shell: bash
        run: |
          set -euo pipefail
          PV="build-pluginval/pluginval_artefacts/Release/pluginval"
          if [ "$RUNNER_OS" = "Windows" ]; then PV="${PV}.exe"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then PV="build-pluginval/pluginval_artefacts/Release/pluginval.app/Contents/MacOS/pluginval"; fi

          validate() {
            "$PV" --strictness-level 10 --validate-in-process --timeout-ms 300000 --validate "$1"
          }

          # AU validation is macOS only (auval). Standalone and VST3 run
          # on every runner.
          validate "build/Chronos_artefacts/Release/VST3/Chronos.vst3"
          validate "build/Chronos_artefacts/Release/Standalone/Chronos.app"
          if [ "$RUNNER_OS" = "macOS" ]; then
            validate "build/Chronos_artefacts/Release/AU/Chronos.component"
          fi

      - name: Derivation scripts (coefficient drift checks)
        run: |
          python -m pip install numpy mpmath
          cd scripts/python
          python f2_regions.py
          python remez_f2_region1.py
          python remez_f1_region1.py
          python remez_dilog_psi.py
          python remez_log1p_small.py

  charts:
    name: Diffuser IR charts
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install modern GCC
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-14 g++-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          g++ --version

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install chart dependencies
        run: python -m pip install numpy matplotlib

      - name: Build the diffuser IR probe
        run: |
          g++ -std=c++23 -O2 -mfma \
            -Isource -Ilibs -Ilibs/simde \
            tests/harnesses/dsp/diffusion_ir_probe.cpp \
            -o diffusion_ir_probe

      - name: Generate the after diffuser IR CSVs
        run: |
          mkdir -p tests/logs/diffusion_ir/after
          ./diffusion_ir_probe dump tests/logs/diffusion_ir/after

      - name: Render the before/after charts
        run: |
          mkdir -p tests/charts
          python scripts/python/diffusion_ir_charts.py \
            --before tests/logs/diffusion_ir/before \
            --after tests/logs/diffusion_ir/after \
            --out tests/charts

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: diffuser-ir-charts
          path: tests/charts/*.png
